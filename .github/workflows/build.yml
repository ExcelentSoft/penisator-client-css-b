name: Build CSS helper (Win32)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply source patches
        shell: pwsh
        run: |
          if (Test-Path tools/patches) {
            foreach ($f in (Get-ChildItem tools/patches -Filter *.py | Sort-Object Name)) {
              python $f.FullName css_helper.cpp
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          }
          exit 0

      - name: Configure 32-bit MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Fetch MinHook for safe function hooks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path external -Force | Out-Null
          git clone --depth 1 https://github.com/TsudaKageyu/minhook.git external/minhook

      - name: Build DLL and injector
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /MT /LD /utf-8 /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /I external\minhook\include /I external\minhook\src /I external\minhook\src\hde css_helper.cpp external\minhook\src\buffer.c external\minhook\src\hook.c external\minhook\src\trampoline.c external\minhook\src\hde\hde32.c /link /MACHINE:X86 /OUT:css_helper.dll user32.lib gdi32.lib kernel32.lib winmm.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W4 /MT /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 injector.cpp /link /MACHINE:X86 /OUT:cs16_injector.exe user32.lib kernel32.lib
          if errorlevel 1 exit /b 1

      - name: Publish binaries
        uses: actions/upload-artifact@v4
        with:
          name: css-helper-win32
          path: |
            css_helper.dll
            cs16_injector.exe
          if-no-files-found: error

      - name: Commit patched source and binaries back to the repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item css_helper.dll dist/css_helper.dll -Force
          Copy-Item cs16_injector.exe dist/cs16_injector.exe -Force
          Compress-Archive -Path css_helper.dll, cs16_injector.exe -DestinationPath dist/css-helper-win32.zip -Force
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add css_helper.cpp dist
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build output and patched source [skip ci]"
            git push
          }
          exit 0
