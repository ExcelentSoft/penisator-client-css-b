name: Build CSS helper (Win32)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure 32-bit MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Fetch MinHook for safe function hooks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path external -Force | Out-Null
          git clone --depth 1 https://github.com/TsudaKageyu/minhook.git external/minhook

      - name: Build DLL and injector
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /MT /LD /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /I external\minhook\include /I external\minhook\src /I external\minhook\src\hde css_helper.cpp external\minhook\src\buffer.c external\minhook\src\hook.c external\minhook\src\trampoline.c external\minhook\src\hde\hde32.c /link /MACHINE:X86 /OUT:css_helper.dll user32.lib gdi32.lib kernel32.lib winmm.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W4 /MT /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 injector.cpp /link /MACHINE:X86 /OUT:cs16_injector.exe user32.lib kernel32.lib
          if errorlevel 1 exit /b 1

      - name: Publish binaries
        uses: actions/upload-artifact@v4
        with:
          name: css-helper-win32
          path: |
            css_helper.dll
            cs16_injector.exe
          if-no-files-found: error
